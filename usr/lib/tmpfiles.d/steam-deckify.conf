# plasmalogin collects the files in /etc/plasmalogin.conf.d once when it
# starts and only re-reads those on relogin, so a file created later is
# ignored until the next boot. steamos-session-select switches between Game
# Mode and the desktop through zz-steamos-autologin.conf, so create it before
# plasmalogin starts. It stays empty until the first switch.
f /etc/plasmalogin.conf.d/zz-steamos-autologin.conf 0644 root root -

# Temporary login files left behind by older steamos-manager builds sort
# after zz-steamos-autologin.conf and override every switch.
r /etc/plasmalogin.conf.d/zzt-holo-temp-login.conf
r /etc/plasmalogin.conf.d/zzt-steamos-temp-login.conf
